[package]
name = "kin-grok-kernel"
version = "0.1.0"
edition = "2021"
publish = false
description = "Per-slot Grok Build outbound kernel"

[[bin]]
name = "kin-grok-kernel"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "socks", "rustls-tls", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time", "io-util"] }
uuid = { version = "1", features = ["v4"] }
