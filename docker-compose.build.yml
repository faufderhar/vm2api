# 本地/开发构建覆盖层。发行安装只用 docker-compose.yml（纯拉镜像）。
# 用法: docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
services:
  vm2api:
    image: ${VM2API_IMAGE:-ghcr.io/dofastted/vm2api}:${VM2API_IMAGE_TAG:-dev}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VM2API_GITHUB_REPO: ${VM2API_GITHUB_REPO:-}
        VM2API_PAYLOAD_BASE_URL: ${VM2API_PAYLOAD_BASE_URL:-}
